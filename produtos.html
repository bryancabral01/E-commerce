<!-- estrutura do cabeçalho -->

        <form class="d-flex" role="search" style="max-width: 400px; margin: auto;">
            <input id="searchInput" class="form-control me-2" type="search" placeholder="Search..." aria-label="Search">
                <button class="btn" type="submit" style="
                    background-color: #2b04d8; 
                    color: white; 
                    width: 50px; 
                    display: flex; 
                    align-items: center; 
                    justify-content: center;
                    border: none;
                    border-radius: 8px;">
                        <i class="bi bi-search" style="font-size: 1.2rem;"></i>
                </button>
                
                <div id="suggestions" class="list-group position-absolute w-100" style="top: 100%; z-index: 1000;"></div>
        </form>

        <div style="margin-right: 50px;">
            <span class="material-symbols-outlined icon" onclick="window.location.href='index.html'">Home</span>
            <span class="material-symbols-outlined icon" onclick="window.location.href='shopping.html'">Shopping_Cart</span>
            <span class="material-symbols-outlined icon" onclick="window.location.href='contato.html'">call</span>
            <span class="material-symbols-outlined icon">Info</span>
        </div> 
        
    </header>

    <<div class="navbar">
        <ul class="ul">
            <li><a href="index.html"><button class="btn-nav">Home</button></li></a>
            <li><a href="produtos.html"><button class="btn-nav">Products</button></li></a>

    <!-- estrutura dos cards -->
        <div id="lista-categorias"></div>

        <div id="map" class="map"></div>
