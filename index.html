<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS do Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
    />
    <!-- JS do Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
    </script>

    <title>Virtual Market | Home</title>
</head>
<body>
    <!-- estrutura do cabeçalho -->
    <header>
        <div style="margin-left: 50px; display: flex; justify-content: center; align-items: center; gap: 10px;">
            <h2 style="color: white;">Virtual Market</h2>
            <span class="material-symbols-outlined" style="color: white; margin-bottom: 5px;">shopping_bag_speed</span>
        </div>
        
    <!-- botão de pesquisa header -->
        <form style="display: flex" role="search" style="max-width: 400px; margin: 0;">
            <input id="searchInput" class="form-control me-2" type="search" placeholder="Search..." aria-label="Search">
                <button class="btn" type="submit" style="
                    background-color: #2b04d8; 
                    color: white; 
                    width: 50px; 
                    display: flex; 
                    align-items: center; 
                    justify-content: center;
                    border: none;
                    border-radius: 8px;">
                        <i class="bi bi-search" style="font-size: 1.2rem;"></i>
                </button>
                
                <div id="suggestions" class="list-group position-absolute w-100" style="top: 100%; z-index: 1000;"></div>
        </form>

        <div style="margin-right: 50px;">
            <span class="material-symbols-outlined icon" onclick="window.location.href='index.html'">Home</span>
            <span class="material-symbols-outlined icon" onclick="window.location.href='shopping.html'">Shopping_Cart</span>
            <span class="material-symbols-outlined icon" onclick="window.location.href='contato.html'">call</span>
            <span class="material-symbols-outlined icon">Info</span>
        </div>        
    </header>

    <div class="navbar">
        <ul class="ul">
            <li><a href="index.html"><button class="btn-nav">Home</button></li></a>
            <li><a href="produtos.html"><button class="btn-nav">Products</button></li></a>
            <li><a href="shopping.html"><button class="btn-nav">Cart</button></li></a>
            <li><a href="contato.html"><button class="btn-nav">Contact</button></li></a>
        </ul>
    </div>

    <!-- estrutura do carrosel -->
    <main>
        <div id="carouselExample" class="carousel slide" data-bs-ride="carousel" data-bs-interval="2000">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="imagens/virtual market.png" class="d-block w-100" alt="verduras" data-bs-interval="2000">
                </div>

                <div class="carousel-item">
                    <img src="imagens/verduras.avif" class="d-block w-100" alt="perfumes" data-bs-interval="2000">
                </div>

                <div class="carousel-item">
                    <img src="imagens/frutas.avif" class="d-block w-100" alt="perfumes" data-bs-interval="2000">
                </div>

                <div class="carousel-item">
                    <img src="imagens/perfumes.avif" class="d-block w-100" alt="cosmeticos" data-bs-interval="2000">
                </div>

                <div class="carousel-item">
                    <img src="imagens/cosmeticos.avif" class="d-block w-100" alt="camas" data-bs-interval="2000">
                </div>

                <div class="carousel-item">
                    <img src="imagens/cama.avif" class="d-block w-100" alt="camas" data-bs-interval="2000">
                </div>
            </div>
        </div>

        <div class="container" style="justify-content: center; align-items: center; text-align: center; margin: 70px auto 0px;">
            <h2>Featured Products</h2>
        </div>

        <!-- estrutura dos cards -->
        <div id="produtos-container" class="produtos-container"></div>
    </main>
 
    <!-- estrutura do rodapé -->
    <footer>
        <div class="container" style="width: 25%; height: 20vh; padding: 0; margin: 0; border-right: 2px solid white;">
            <p>@Bryan Cabral - 2025</p>
            <p>All rights reserved</p>
            <p>Virtual Market</p>
            <p>Porto Alegre - RS / Brasil</p>
            <p>Online sales</p>
        </div>
        
        <div id="map" class="map"></div>
            
        <div id="info">
            <h1>Discover our Location</h1>
            <button id="btnLocalizar">Click here!</button>
            <p id="resultado">Click the button to see the location...</p>
        </div>
    </footer>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        
        <div id="qr-container" style="display:none; text-align:center; padding:20px;">
        <button id="fecharQR">Fechar</button><br><br>
        <img src="imagens/qr.png" style="width:200px;">
    </div>
</body>
</html>
