<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- CSS do Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
    />
    <!-- JS do Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
    </script>

    <title>Virtual Market</title>
</head>
<body>
    <!-- estrutura do cabeçalho -->
    <header>
        <div style="margin-left: 50px; display: flex; justify-content: center; align-items: center; gap: 10px;">
            <h2 style="color: white;">Virtual Market</h2>
            <span class="material-symbols-outlined" style="color: white; margin-bottom: 5px;">shopping_bag_speed</span>
        </div>
        
    <!-- botão de pesquisa header -->
        <form class="d-flex" role="search" style="max-width: 400px; margin: auto;">
            <input id="searchInput" class="form-control me-2" type="search" placeholder="Buscar produtos..." aria-label="Search">
                <button class="btn" type="submit" style="
                    background-color: #2b04d8; 
                    color: white; 
                    width: 50px; 
                    display: flex; 
                    align-items: center; 
                    justify-content: center;
                    border: none;
                    border-radius: 8px;">
                        <i class="bi bi-search" style="font-size: 1.2rem;"></i>
                </button>
                
                <div id="suggestions" class="list-group position-absolute w-100" style="top: 100%; z-index: 1000;"></div>
        </form>

        <div style="margin-right: 50px;">
            <span class="material-symbols-outlined icon" onclick="window.location.href='http://127.0.0.1:5501/index.html'">Home</span>
            <span class="material-symbols-outlined icon">Person</span>
            <span class="material-symbols-outlined icon" onclick="window.location.href='http://127.0.0.1:5501/shopping.html'">Shopping_Cart</span>
            <span class="material-symbols-outlined icon">Info</span>
        </div>
        
    </header>

    <!-- estrutura dos cards -->
    <main>
        <div id="carouselExample" class="carousel slide" data-bs-ride="carousel" data-bs-interval="2000">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="imagens/virtual market.png" class="d-block w-100" alt="verduras" data-bs-interval="2000">
                </div>

                <div class="carousel-item">
                    <img src="imagens/verduras.avif" class="d-block w-100" alt="perfumes" data-bs-interval="2000">
                </div>

                <div class="carousel-item">
                    <img src="imagens/frutas.avif" class="d-block w-100" alt="perfumes" data-bs-interval="2000">
                </div>

                <div class="carousel-item">
                    <img src="imagens/perfumes.avif" class="d-block w-100" alt="cosmeticos" data-bs-interval="2000">
                </div>

                <div class="carousel-item">
                    <img src="imagens/cosmeticos.avif" class="d-block w-100" alt="camas" data-bs-interval="2000">
                </div>

                <div class="carousel-item">
                    <img src="imagens/cama.avif" class="d-block w-100" alt="camas" data-bs-interval="2000">
                </div>
            </div>
        </div>

        <div id="produto-container" class="produtos-container"></div>
    </main>
 
    <!-- estrutura do rodapé -->
    <footer>

        <!-- Conteúdo por cima -->
         
            <div class="container" style="width: 25%; height: 20vh; padding: 0; margin: 0; border-right: 2px solid white;">
                <p>@Bryan Cabral - 2025</p>
                <p>Todos os direitos reservados</p>
                <p>Virtual Market</p>
                <p>Porto Alegre - RS / Brasil</p>
                <p>Vendas online</p>
            </div>
        
            <div id="map" class="map"></div>
            <div id="info">
                <h1>Descubra nossa Localização</h1>
                <button id="btnLocalizar">Clique aqui!</button>
                <p id="resultado">Clique no botão para vermos a localização...</p>
            </div>
    </footer>


  <script src="script.js"></script>
</body>
</html>
    </footer>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
