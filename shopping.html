            <span class="material-symbols-outlined" style="color: white; margin-bottom: 5px;">shopping_bag_speed</span>
        </div>

        <h2 class="text-light" >Your Cart</h2>

        <div style="margin-right: 50px;">
            <span class="material-symbols-outlined icon" onclick="window.location.href='index.html'">Home</span>
            <span class="material-symbols-outlined icon" onclick="window.location.href='shopping.html'">Shopping_Cart</span>

    <div class="navbar">

  </main>

        <div id="info">
